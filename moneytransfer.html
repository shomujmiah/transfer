<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Money Transfer</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Money Transfer">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- OneSignal SDK Initialization -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "6b447a69-bc05-4b52-9321-b1edba94e51c",
        allowLocalhostAsSecureOrigin: true
      });

      const savedEmail = localStorage.getItem('manualUserEmail');
      if (savedEmail) {
        tagAndLoginOneSignalUser(savedEmail);
      }
    });

    async function tagAndLoginOneSignalUser(email) {
      window.OneSignalDeferred.push(async function(OneSignal) {
        const cleanEmail = email.toLowerCase().trim();
        await OneSignal.login(cleanEmail);
        await OneSignal.User.addTag("user_email", cleanEmail);
      });
    }

    // Listen for secure messages sent from the Google Apps Script iframe
    window.addEventListener("message", async function(event) {
      // Optional: uncomment to verify origin if needed, or allow all for GAS subdomains
      // if (!event.origin.includes("script.google.com")) return;

      if (event.data && event.data.type === "TRIGGER_ONESIGNAL_PUSH") {
        const email = event.data.email;
        if (email) {
          await tagAndLoginOneSignalUser(email);
        }
        window.OneSignalDeferred.push(async function(OneSignal) {
          try {
            // Force native prompt & slidedown upon valid user button trigger
            await OneSignal.Notifications.requestPermission();
            if (OneSignal.Slidedown && typeof OneSignal.Slidedown.promptPush === 'function') {
              await OneSignal.Slidedown.promptPush({ force: true });
            }
          } catch (e) {
            console.error("Error prompting push notifications:", e);
          }
        });
      }
    });
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fdfbf7;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbx96HUcW6fg2gwW6x1d9QNOsSpSGCrLfwCfWIe3PbshQ2q026wpbr-D_hvudqS9m1tIWA/exec"></iframe>
</body>
</html>
