<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Money Transfer</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Money Transfer">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- OneSignal SDK Integration -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    console.log("DIAGNOSTIC: Outer wrapper script loaded.");

    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "6b447a69-bc05-4b52-9321-b1edba94e51c",
        allowLocalhostAsSecureOrigin: true
      });

      // Sync user tag on boot if email session is found locally
      const savedEmail = localStorage.getItem('manualUserEmail');
      if (savedEmail) {
        tagAndLoginOneSignalUser(savedEmail);
      }
    });

    async function tagAndLoginOneSignalUser(email) {
      window.OneSignalDeferred.push(async function(OneSignal) {
        const cleanEmail = email.toLowerCase().trim();
        await OneSignal.login(cleanEmail);
        await OneSignal.User.addTag("user_email", cleanEmail);
        console.log("DIAGNOSTIC: OneSignal tagged user email ->", cleanEmail);
      });
    }

    // Watch for localStorage trigger flags from the inner iframe app
    window.addEventListener("storage", async function(event) {
      if (event.key === "TRIGGER_ONESIGNAL_FLAG" && event.newValue) {
        const email = localStorage.getItem('manualUserEmail');
        console.log("DIAGNOSTIC: Storage trigger detected for email:", email);
        
        if (email) {
          await tagAndLoginOneSignalUser(email);
        }
        
        window.OneSignalDeferred.push(async function(OneSignal) {
          try {
            const permission = await OneSignal.Notifications.requestPermission();
            console.log("DIAGNOSTIC: Permission result:", permission);
            if (OneSignal.Slidedown) {
              await OneSignal.Slidedown.promptPush();
            }
          } catch (e) {
            console.error("DIAGNOSTIC ERROR triggering prompt:", e);
          }
        });
        
        // Clear the flag so it can be re-triggered later if needed
        localStorage.removeItem("TRIGGER_ONESIGNAL_FLAG");
      }
    });
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fdfbf7;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

</body>
</html>
