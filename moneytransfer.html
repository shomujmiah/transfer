<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Money Transfer</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Money Transfer">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- OneSignal SDK Integration -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    console.log("DIAGNOSTIC: Outer wrapper script loaded.");

    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal) {
      console.log("DIAGNOSTIC: OneSignal initialized successfully.");
      await OneSignal.init({
        appId: "6b447a69-bc05-4b52-9321-b1edba94e51c",
        allowLocalhostAsSecureOrigin: true
      });

      const savedEmail = localStorage.getItem('manualUserEmail');
      if (savedEmail) {
        tagAndLoginOneSignalUser(savedEmail);
      }
    });

    async function tagAndLoginOneSignalUser(email) {
      window.OneSignalDeferred.push(async function(OneSignal) {
        const cleanEmail = email.toLowerCase().trim();
        await OneSignal.login(cleanEmail);
        await OneSignal.User.addTag("user_email", cleanEmail);
        console.log("DIAGNOSTIC: OneSignal tagged user email ->", cleanEmail);
      });
    }

    // Secure message listener from the Google Apps Script iframe
    window.addEventListener("message", async function(event) {
      console.log("DIAGNOSTIC: Outer wrapper received postMessage event:", event.data);

      if (event.data && event.data.type === "TRIGGER_ONESIGNAL_PUSH") {
        const email = event.data.email;
        
        // Show a temporary debug notice on the outer screen
        showOuterDebugBanner("Trigger received for: " + (email || "unknown"));

        if (email) {
          await tagAndLoginOneSignalUser(email);
        }
        
        window.OneSignalDeferred.push(async function(OneSignal) {
          try {
            console.log("DIAGNOSTIC: Requesting OneSignal push permissions...");
            const permission = await OneSignal.Notifications.requestPermission();
            console.log("DIAGNOSTIC: Permission result:", permission);
            
            if (OneSignal.Slidedown) {
              await OneSignal.Slidedown.promptPush();
            }
          } catch (e) {
            console.error("DIAGNOSTIC ERROR triggering prompt:", e);
          }
        });
      }
    });

    function showOuterDebugBanner(text) {
      let banner = document.getElementById('debugBanner');
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'debugBanner';
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#10b981;color:white;text-align:center;font-size:12px;font-weight:bold;padding:6px;z-index:99999;';
        document.body.prepend(banner);
      }
      banner.textContent = "DEBUG: " + text;
      setTimeout(() => banner.remove(), 4000);
    }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fdfbf7;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbx96HUcW6fg2gwW6x1d9QNOsSpSGCrLfwCfWIe3PbshQ2q026wpbr-D_hvudqS9m1tIWA/exec"></iframe>
</body>
</html>
