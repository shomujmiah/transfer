<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Money Transfer</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Money Transfer">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- OneSignal SDK Integration -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "6b447a69-bc05-4b52-9321-b1edba94e51c",
        allowLocalhostAsSecureOrigin: true,
        serviceWorkerPath: "transfer/OneSignalSDK.worker.js",
        serviceWorkerParam: { scope: "/transfer/" },
        serviceWorkerScope: "/transfer/"
      });

      const savedEmail = localStorage.getItem('manualUserEmail');
      if (savedEmail) {
        tagAndLoginUser(OneSignal, savedEmail);
      }
    });

    async function tagAndLoginUser(OneSignal, email) {
      try {
        const cleanEmail = email.toLowerCase().trim();
        await OneSignal.login(cleanEmail);
        await OneSignal.User.addTag("user_email", cleanEmail);
      } catch (err) {
        console.error("OneSignal login/tag error:", err);
      }
    }

    window.addEventListener("message", async function(event) {
      const data = event.data;
      if (!data || !data.type) return;

      if (data.type === "SAVE_USER_EMAIL") {
        if (data.email) {
          localStorage.setItem('manualUserEmail', data.email);
          document.cookie = `manualUserEmail=${encodeURIComponent(data.email)}; max-age=31536000; path=/; secure; samesite=none`;
          console.log("DEBUG WRAPPER: Saved email to localStorage & cookie:", data.email);
        }
      }

      if (data.type === "CLEAR_USER_EMAIL") {
        localStorage.removeItem('manualUserEmail');
        document.cookie = "manualUserEmail=; max-age=0; path=/; secure; samesite=none";
      }
    });
  </script>

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #fdfbf7;
    }
    iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
    #debug-banner {
      position: fixed; top: 0; left: 0; right: 0; background: #333; color: #ff5555; 
      font-family: monospace; font-size: 11px; padding: 4px 8px; z-index: 99999; display: none;
    }
  </style>
</head>
<body>
  <div id="debug-banner"></div>
  <script>
    const savedEmail = localStorage.getItem('manualUserEmail') || '';
    const cookieEmail = document.cookie.replace(/(?:(?:^|.*;\s*)manualUserEmail\s*\=\s*([^;]*).*$)|^.*$/, "$1");
    
    console.log("DEBUG WRAPPER BOOT -> localStorage email:", savedEmail, "| Cookie email:", cookieEmail);

    // If localStorage wiped out, try recovering from cookie!
    const activeEmail = savedEmail || decodeURIComponent(cookieEmail || '');

    const baseUrl = "https://script.google.com/macros/s/AKfycbx96HUcW6fg2gwW6x1d9QNOsSpSGCrLfwCfWIe3PbshQ2q026wpbr-D_hvudqS9m1tIWA/exec";
    const targetSrc = activeEmail ? `${baseUrl}?email=${encodeURIComponent(activeEmail)}` : baseUrl;
    
    if (!activeEmail) {
      const banner = document.getElementById('debug-banner');
      banner.style.display = 'block';
      banner.innerText = 'DIAGNOSTIC: No saved email found in storage after kill!';
    }

    document.write('<iframe id="appIframe" src="' + targetSrc + '"></iframe>');
  </script>
</body>
</html>
