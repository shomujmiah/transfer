<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Money Transfer</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Money Transfer">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- OneSignal SDK Integration -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "6b447a69-bc05-4b52-9321-b1edba94e51c", // <-- Ensure this matches your active OneSignal Dashboard App ID
        allowLocalhostAsSecureOrigin: true
      });

      const savedEmail = localStorage.getItem('manualUserEmail');
      if (savedEmail) {
        await tagAndLoginUser(OneSignal, savedEmail);
      }
    });

    async function tagAndLoginUser(OneSignal, email) {
      try {
        const cleanEmail = email.toLowerCase().trim();
        await OneSignal.login(cleanEmail);
        await OneSignal.User.addTag("user_email", cleanEmail);
        console.log("OneSignal successfully linked to:", cleanEmail);
      } catch (err) {
        console.error("OneSignal login/tag error:", err);
      }
    }

    // Secure message listener from the top-level iframe bridge
    window.addEventListener("message", async function(event) {
      if (event.data && event.data.type === "TRIGGER_ONESIGNAL_PUSH") {
        const email = event.data.email;
        
        window.OneSignalDeferred.push(async function(OneSignal) {
          try {
            if (email) {
              await tagAndLoginUser(OneSignal, email);
            }
            
            const permission = await OneSignal.Notifications.requestPermission();
            console.log("Permission request result:", permission);
            
            if (permission && OneSignal.Slidedown) {
              await OneSignal.Slidedown.promptPush();
            }
          } catch (e) {
            console.error("Error triggering push prompt:", e);
          }
        });
      }
    });
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fdfbf7;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbx96HUcW6fg2gwW6x1d9QNOsSpSGCrLfwCfWIe3PbshQ2q026wpbr-D_hvudqS9m1tIWA/exec"></iframe>
</body>
</html>
