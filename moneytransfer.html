<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Money Transfer</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Money Transfer">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- OneSignal SDK Integration -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "6b447a69-bc05-4b52-9321-b1edba94e51c",
        allowLocalhostAsSecureOrigin: true,
        serviceWorkerPath: "transfer/OneSignalSDK.worker.js",
        serviceWorkerParam: { scope: "/transfer/" },
        serviceWorkerScope: "/transfer/"
      });

      const savedEmail = localStorage.getItem('manualUserEmail');
      if (savedEmail) {
        tagAndLoginUser(OneSignal, savedEmail);
      }
    });

    async function tagAndLoginUser(OneSignal, email) {
      try {
        const cleanEmail = email.toLowerCase().trim();
        await OneSignal.login(cleanEmail);
        await OneSignal.User.addTag("user_email", cleanEmail);
      } catch (err) {
        console.error("OneSignal login/tag error:", err);
      }
    }

    // Secure message listener to capture email storage & notifications from iframe
    window.addEventListener("message", async function(event) {
    const origin = event.origin || "";
    if (!origin.includes("google.com") && !origin.includes("googleusercontent.com") && !origin.includes("localhost") && !origin.includes("shomujmiah.github.io")) {
      return;
    }

    const data = event.data;
    if (!data || !data.type) return;

    if (data.type === "SAVE_USER_EMAIL") {
      if (data.email) {
        localStorage.setItem('manualUserEmail', data.email);
        // Write a 1-year cookie so the browser sends it across iframe boundaries
        document.cookie = `manualUserEmail=${encodeURIComponent(data.email)}; max-age=31536000; path=/; secure; samesite=none`;
      }
    }

    if (data.type === "CLEAR_USER_EMAIL") {
      localStorage.removeItem('manualUserEmail');
      document.cookie = "manualUserEmail=; max-age=0; path=/; secure; samesite=none";
    }

      if (data.type === "TRIGGER_ONESIGNAL_PUSH") {
        const email = data.email;
        window.OneSignalDeferred.push(async function(OneSignal) {
          try {
            if (email) {
              await OneSignal.login(email.toLowerCase().trim());
            }
            await OneSignal.Notifications.requestPermission();
          } catch (e) {
            console.error("OneSignal push error:", e);
          }
        });
      }

      if (data.type === "UPDATE_ONESIGNAL_MULTIPLE_TAGS") {
        const { email, tags } = data;
        window.OneSignalDeferred.push(async function(OneSignal) {
          try {
            if (email) {
              await OneSignal.login(email.toLowerCase().trim());
            }
            await OneSignal.User.addTags(tags);
          } catch (err) {
            console.error("OneSignal tag error:", err);
          }
        });
      }
    });

    // Dynamically inject iframe with saved email query parameter on load
    window.addEventListener("DOMContentLoaded", () => {
      const savedEmail = localStorage.getItem('manualUserEmail') || '';
      const iframe = document.getElementById('appIframe');
      const baseUrl = "https://script.google.com/macros/s/AKfycbx96HUcW6fg2gwW6x1d9QNOsSpSGCrLfwCfWIe3PbshQ2q026wpbr-D_hvudqS9m1tIWA/exec";
      iframe.src = savedEmail ? `${baseUrl}?email=${encodeURIComponent(savedEmail)}` : baseUrl;
    });
  </script>

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #fdfbf7;
    }
    iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
  </style>
</head>
<body>
  <iframe id="appIframe"></iframe>
</body>
</html>
