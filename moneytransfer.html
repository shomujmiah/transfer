<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Money Transfer</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Money Transfer">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- OneSignal SDK Integration -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "6b447a69-bc05-4b52-9321-b1edba94e51c",
        allowLocalhostAsSecureOrigin: true,
        serviceWorkerPath: "transfer/OneSignalSDK.worker.js",
        serviceWorkerParam: { scope: "/transfer/" },
        serviceWorkerScope: "/transfer/"
      });

      const urlParams = new URLSearchParams(window.location.search);
      const email = urlParams.get('email') || localStorage.getItem('manualUserEmail');
      if (email) {
        tagAndLoginUser(OneSignal, email);
      }
    });

    async function tagAndLoginUser(OneSignal, email) {
      try {
        const cleanEmail = email.toLowerCase().trim();
        await OneSignal.login(cleanEmail);
        await OneSignal.User.addTag("user_email", cleanEmail);
      } catch (err) {
        console.error("OneSignal login/tag error:", err);
      }
    }

    // Listen for iframe wanting to save user email and reload wrapper with query param
    window.addEventListener("message", function(event) {
      const data = event.data;
      if (!data || !data.type) return;

      if (data.type === "SAVE_USER_EMAIL" && data.email) {
        const cleanEmail = data.email.trim().toLowerCase();
        localStorage.setItem('manualUserEmail', cleanEmail);
        
        // Force reload wrapper with email in URL query string
        const newUrl = `${window.location.pathname}?email=${encodeURIComponent(cleanEmail)}`;
        window.location.href = newUrl;
      }

      if (data.type === "CLEAR_USER_EMAIL") {
        localStorage.removeItem('manualUserEmail');
        window.location.href = window.location.pathname;
      }
    });
  </script>

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #fdfbf7;
    }
    iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
  </style>
</head>
<body>
  <script>
    // Extract email from URL query string (?email=...) or fallback storage
    const urlParams = new URLSearchParams(window.location.search);
    let activeEmail = urlParams.get('email') || localStorage.getItem('manualUserEmail') || '';

    // Self-heal: if URL lacked query parameter but localStorage had it, reload with it
    if (!urlParams.get('email') && activeEmail) {
      window.location.replace(`${window.location.pathname}?email=${encodeURIComponent(activeEmail)}`);
    }

    const baseUrl = "https://script.google.com/macros/s/AKfycbx96HUcW6fg2gwW6x1d9QNOsSpSGCrLfwCfWIe3PbshQ2q026wpbr-D_hvudqS9m1tIWA/exec";
    const targetSrc = activeEmail ? `${baseUrl}?email=${encodeURIComponent(activeEmail)}` : baseUrl;
    
    // Safely create the iframe via DOM methods instead of document.write()
    const iframe = document.createElement('iframe');
    iframe.id = 'appIframe';
    iframe.src = targetSrc;
    document.body.appendChild(iframe);
  </script>
</body>
</html>
