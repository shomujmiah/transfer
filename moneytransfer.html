<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Money Transfer</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Money Transfer">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- OneSignal SDK Integration -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "6b447a69-bc05-4b52-9321-b1edba94e51c",
        allowLocalhostAsSecureOrigin: true
      });

      // Check if user is already logged in on boot
      const savedEmail = localStorage.getItem('manualUserEmail');
      if (savedEmail) {
        await OneSignal.login(savedEmail.toLowerCase().trim());
        await OneSignal.User.addTag("user_email", savedEmail.toLowerCase().trim());
      }
    });

    // Listen for storage triggers from the inner Apps Script iframe
    window.addEventListener("storage", async function(event) {
      if (event.key === "TRIGGER_ONESIGNAL_FLAG" && event.newValue) {
        const email = localStorage.getItem("onesignal_target_email") || localStorage.getItem('manualUserEmail');
        
        if (email) {
          window.OneSignalDeferred.push(async function(OneSignal) {
            try {
              const cleanEmail = email.toLowerCase().trim();
              await OneSignal.login(cleanEmail);
              await OneSignal.User.addTag("user_email", cleanEmail);
              
              // Request push permission directly
              await OneSignal.Notifications.requestPermission();
              if (OneSignal.Slidedown) {
                await OneSignal.Slidedown.promptPush();
              }
            } catch (e) {
              console.error("Error requesting OneSignal permission:", e);
            }
          });
        }
        localStorage.removeItem("TRIGGER_ONESIGNAL_FLAG");
      }
    });
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fdfbf7;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Replace with your exact Google Apps Script Web App Deployment URL -->
  <iframe src="https://script.google.com/macros/s/AKfycbx96HUcW6fg2gwW6x1d9QNOsSpSGCrLfwCfWIe3PbshQ2q026wpbr-D_hvudqS9m1tIWA/exec"></iframe>
</body>
</html>
